# LLM 服务配置
api:
  base_url: "http://localhost:20128/v1"
  api_key: "sk-54027ea1b7cab6a1-9yi909-90d259c0"
  model: "yuanshennb"

# Embedding 服务配置
Embedding_api:
  model: "wo/text-embedding-3-large"
  base_url: "http://localhost:20128"
  api_key: "sk-54027ea1b7cab6a1-9yi909-90d259c0"

# Agent Runtime参数
runtime:
  max_tool_rounds: 8   # 单步内工具调用最大轮数（assistant → tool → assistant 为一轮）
  max_replans: 1       # 单任务最多重规划次数（验证失败后生成替代 Plan）
  max_steps: 12        # 单次 Plan 最大步骤数
  context_window: 12   # 上下文压缩阈值，超出此轮数后触发滚动摘要
  max_advisor_calls_per_step: 1  # 单步最多 ask_advisor 调用次数

# Advisor 高级顾问服务配置
advisor:
  enabled: true
  base_url: "http://localhost:20128/v1"   # 改为你自己的 advisor 网关
  api_key: "sk-54027ea1b7cab6a1-9yi909-90d259c0"                              # 改为你自己的 advisor key
  model: "plans"                        # 理论上，这个应该是更为高级的模型，比如主模型sonnet，这个就配置opus
  timeout_seconds: 90
  max_question_chars: 4000
  max_context_chars: 16000
  max_attempts_chars: 8000

# 动态数据目录
catalog:
  enabled: true
  default_database: sparkmind_demo
  cache_path: artifacts/catalog/catalog.json
  cache_ttl_seconds: 300
  semantic_path: config/semantic_catalog.yaml
  max_tables_per_response: 50
  max_columns_per_response: 200
