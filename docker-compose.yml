services:
  spark-master:
    image: apache/spark:3.5.3
    container_name: sparkos-spark-master
    hostname: spark-master

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"

    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_EVENTLOG_ENABLED: "true"
      SPARK_EVENTLOG_DIR: "file:/opt/sparkos/artifacts/spark-events"
      SPARK_HISTORY_FS_LOG_DIRECTORY: "file:/opt/sparkos/artifacts/spark-events"
      SPARK_SQL_SESSION_TIMEZONE: "Asia/Shanghai"
      SPARK_SQL_SHUFFLE_PARTITIONS: "4"
      SPARK_UI_SHOWCONSOLE_PROGRESS: "false"

    ports:
      - "7077:7077"
      - "8080:8080"

    volumes:
      - ${SPARKOS_REPO_ROOT:-.}:/opt/sparkos

    networks:
      - spark-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080 || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s


  spark-worker:
    image: apache/spark:3.5.3
    hostname: spark-worker

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --webui-port
      - "8081"
      - spark://spark-master:7077

    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2g"
      SPARK_EVENTLOG_ENABLED: "true"
      SPARK_EVENTLOG_DIR: "file:/opt/sparkos/artifacts/spark-events"
      SPARK_HISTORY_FS_LOG_DIRECTORY: "file:/opt/sparkos/artifacts/spark-events"
      SPARK_SQL_SESSION_TIMEZONE: "Asia/Shanghai"
      SPARK_SQL_SHUFFLE_PARTITIONS: "4"
      SPARK_UI_SHOWCONSOLE_PROGRESS: "false"

    depends_on:
      spark-master:
        condition: service_healthy

    expose:
      - "8081"

    volumes:
      - ${SPARKOS_REPO_ROOT:-.}:/opt/sparkos

    networks:
      - spark-network

    restart: unless-stopped


  spark-client:
    image: apache/spark:3.5.3
    profiles:
      - jobs

    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_started

    volumes:
      - ${SPARKOS_REPO_ROOT:-.}:/opt/sparkos

    networks:
      - spark-network


  spark-history:
    image: apache/spark:3.5.3
    container_name: sparkos-spark-history
    hostname: spark-history

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.history.HistoryServer

    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_HISTORY_OPTS: >-
        -Dspark.history.fs.logDirectory=file:/opt/sparkos/artifacts/spark-events
        -Dspark.history.ui.port=18080

    depends_on:
      - spark-master

    ports:
      - "18080:18080"

    volumes:
      - ${SPARKOS_REPO_ROOT:-.}:/opt/sparkos

    networks:
      - spark-network

    restart: unless-stopped


  hive:
    image: apache/hive:4.1.0
    container_name: sparkos-hive
    hostname: hive

    profiles:
      - hive

    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      HIVE_SERVER2_THRIFT_PORT: "10000"

    ports:
      - "10000:10000"
      - "10002:10002"

    volumes:
      - hive-warehouse:/opt/hive/data/warehouse

    networks:
      - spark-network

    restart: unless-stopped


networks:
  spark-network:
    driver: bridge


volumes:
  hive-warehouse:
